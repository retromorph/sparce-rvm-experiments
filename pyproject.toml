[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sparce-rvm-experiments"
version = "0.1.0"
description = "Verified sparse Bayesian corrective memory experiments for coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "SPaRCE contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "mlflow>=3.5,<5",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.4,<3",
  "transformers>=4.49,<6",
  "accelerate>=1.2,<2",
  "sentence-transformers>=3.4,<6",
  "safetensors>=0.5,<1",
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
sparce = "sparce.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sparce"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
