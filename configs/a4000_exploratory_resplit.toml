[run]
name = "sparce-a4000-poc-exploratory-v03"
seed = 42
seeds = [42, 1337, 2026]
experiment_ids = ["E1", "E2", "E3"]
mlflow_uri = "http://127.0.0.1:5000"
mlflow_experiment = "sparce-poc-exploratory"
output_dir = "reports/generated/exploratory_v0.3_standalone"
work_dir = "runs/full2"
# Optional pilot limit on the number of clusters (0 = full benchmark)
limit_clusters = 0

[hardware]
gpu_name = "NVIDIA RTX A4000"
vram_gb = 16
max_vram_fraction = 0.85
max_walltime_hours = 9

[model]
id = "Qwen/Qwen2.5-Coder-3B-Instruct"
revision = "488639f1ff808d1d3d0ba301aef8c11461451ec5"
dtype = "float16"
max_input_tokens = 2048
# 384 instead of the scaffold's 256: pilot showed whole-module rewrites of 15-25 line programs
# can exceed 256 tokens; identical budget for every method and baseline.
max_new_tokens = 384
# Measured on the A4000 (2026-10-17): batch 8 -> 6.7 GB peak, batch 16 -> 15.8 GB peak (unsafe).
batch_size = 12
num_candidates = 4
temperature = 0.8
top_p = 0.95
# candidate 0 is greedy (temperature 0); candidates 1..K-1 are sampled with a task-derived seed.
# K raised from 2 to 4 after the 2026-10-17 pilot (30 clusters): recall@2 was 27% vs greedy 23%, leaving no room for any reranker.

[embedding]
id = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
batch_size = 64

[rvm]
max_basis = 64
length_scale = 0.6
min_support = 0.65
posterior_z = 1.64
margin_threshold = 0.05
# validation-only grids (locked before test evaluation; see docs/EXPERIMENT_PROTOCOL.md v0.2)
length_scale_grid = [0.4, 0.6, 0.9]
min_support_grid = [0.5, 0.65, 0.8]
posterior_z_grid = [1.0, 1.64]
margin_threshold_grid = [0.0, 0.05, 0.2]

[knn]
k_grid = [1, 3, 5]
threshold_grid = [0.0, 0.2, 0.5]
min_support_grid = [0.5, 0.65, 0.8]

[eval]
min_test_cases = 200
min_negative_controls = 1000
update_checkpoints = [10, 50, 100, 500]
bootstrap_replicates = 2000
confidence = 0.95
capacities = [8, 16, 32, 64, 128]
e1_methods = ["base", "rules", "rag", "knn_full", "knn_cap", "rvm", "rvm_noscope", "rvm_nogate"]
e2_methods = ["rvm", "knn_cap", "random", "medoids"]
false_submissions = 20

[dataset]
# EXPLORATORY (protocol v0.3, decided post hoc after the v0.2 test results): deployment-window timestamps.
timestamp_mode = "deployment_window"
deployment_start = "2025-02-01"
variants = 2
train_fraction = 0.45
val_fraction = 0.15
heldout_family_fraction = 0.2

[verifier]
# Isolated, non-root, network-disabled Docker runtime (see src/sparce/sandbox.py).
backend = "docker"
network = "none"
max_walltime_seconds = 30
max_memory_mb = 2048
max_pids = 128
cpus = 2.0
batch_size = 24
workers = 6
