name: cpu-ci
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --group dev
      - run: uv run pytest -q
      - run: uv run sparce smoke --no-mlflow
      - run: uv run sparce run-suite --dry-run
